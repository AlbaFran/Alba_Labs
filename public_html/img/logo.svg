<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Núcleo do átomo -->
  <circle cx="24" cy="24" r="3.2" fill="#ffffff" stroke="none" />
  
  <!-- Órbita 1 (horizontal) -->
  <ellipse cx="24" cy="24" rx="20" ry="7" />
  
  <!-- Órbita 2 (inclinada a 60 graus) -->
  <ellipse cx="24" cy="24" rx="20" ry="7" transform="rotate(60 24 24)" />
  
  <!-- Órbita 3 (inclinada a 120 graus) -->
  <ellipse cx="24" cy="24" rx="20" ry="7" transform="rotate(120 24 24)" />
</svg>
